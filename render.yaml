services:
  - type: web
    name: ppe-style-engine
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INGEST_API_KEY
        sync: false
      - key: PPE_DB_PATH
        value: /data/ppe_engine.db
    disk:
      name: ppe-data
      mountPath: /data
      sizeGB: 10
